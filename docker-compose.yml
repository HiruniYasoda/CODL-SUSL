version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codl_backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-codl_susl}
      DB_USERNAME: ${DB_USERNAME:-codluser}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./backend/storage:/var/www/html/storage
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codl_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      - ./backend/storage:/var/www/html/storage
    depends_on:
      - backend

  db:
    image: mysql:8.0
    container_name: codl_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-codl_susl}
      MYSQL_USER: ${DB_USERNAME:-codluser}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: codl_redis
    restart: unless-stopped

volumes:
  dbdata:

